# Render Blueprint: deploys PlayCount from main once CI passes.
# Secrets are declared with `sync: false` so Render asks for them in its dashboard;
# their values never live in this repo. Render takes the Node version from .nvmrc.
services:
  - type: web
    name: playcount
    runtime: node
    plan: free
    branch: main
    autoDeployTrigger: checksPass
    buildCommand: npm ci --omit=dev
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      # The seeded demo Developer's PlayCount key, shown to visitors who have not signed in.
      - key: PLAYCOUNT_DEMO_KEY
        generateValue: true
      - key: PAYPAL_CLIENT_ID
        sync: false
      - key: PAYPAL_CLIENT_SECRET
        sync: false
      # Claimed Projects seeded at startup, as project=payout-email pairs; maintainers can also Claim on the site.
      - key: PLAYCOUNT_SEED_CLAIMS
        sync: false
      # Simulated Developers seeded with Budgets and Plays, labelled as simulated everywhere.
      - key: PLAYCOUNT_SIMULATED_DEVELOPERS
        value: "5"
      # The Weighting model: Groq (preferred) or AssemblyAI's LLM Gateway, not the Anthropic API.
      - key: GROQ_API_KEY
        sync: false
      - key: ASSEMBLYAI_API_KEY
        sync: false
      # GitHub OAuth app for Developer and maintainer sign-in; its callback is <service URL>/auth/github/callback.
      - key: GITHUB_CLIENT_ID
        sync: false
      - key: GITHUB_CLIENT_SECRET
        sync: false
